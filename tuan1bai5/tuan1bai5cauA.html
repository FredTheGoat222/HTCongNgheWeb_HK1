<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            border: 1px solid;
            width: 1000px;
            box-sizing: border-box;
            height: 500px;
        }
        table {
            border: 2px solid #555;
            border-collapse: separate; /* Giữ khoảng cách viền đôi theo mẫu */
            border-spacing: 2px;
            font-family: "Times New Roman", Times, serif;
        }
        caption {
            font-size: 20px;
            font-weight: normal;
            margin-bottom: 5px;
        }
        th, td {
            border: 1px solid #777;
            padding: 8px 12px;
            text-align: left;
        }
        .header-cell {
            text-align: center;
            font-weight: bold;
            font-size: 18px;
        }
        .screen-cell {
            font-weight: bold;
            font-size: 16px;
            text-align: center;
            width: 80px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="padding-left: 400px;">Classic Movie Day</h2>
        <div style="padding-left: 150px;">
            <table>
                <tr>
                    <th></th>
                    <th class="header-cell">5 pm</th>
                    <th class="header-cell">7 pm</th>
                    <th class="header-cell">9 pm</th>
                    <th class="header-cell">11 pm</th>
                </tr>

                <tr>
                    <td class="screen-cell">Screen <br> one</td>
                    <td>Star Wars</td>
                    <td>Empire Strikes Back</td>
                    <td>Return of the Jedi</td>
                    <td>The Exorcist</td>
                </tr>

                <tr>
                    <td class="screen-cell">Screen <br> two</td>
                    <td colspan="2">Dances with Wolves</td>
                    <td colspan="2">Gone With the Wind</td>
                </tr>
                <tr>
                    <td class="screen-cell">Screen <br> three</td>
                    <td colspan="2">2001: A Space Odyssey</td>
                    <td>The Conversation</td>
                    <td>5 Easy Pieces</td>
                </tr>

            </table>
        </div>
    </div>
</body>
</html>
