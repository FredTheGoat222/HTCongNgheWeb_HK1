<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            border: 2px solid #5b9bd5;
            width: 600px;
            padding: 15px 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 26px;
            margin: 0 0 15px 0;
        }

        fieldset {
            border: 1px solid #777;
            padding: 10px 15px 15px 15px;
            margin-bottom: 12px;
        }

        legend {
            font-size: 16px;
            padding: 0 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            padding: 4px 0;
            font-size: 16px;
            vertical-align: middle;
        }

        .label-col {
            width: 110px;
            vertical-align: top;
            padding-top: 6px;
        }

        input[type="text"], input[type="email"] {
            width: 220px;
            padding: 2px 4px;
            border: 1px solid #777;
            font-family: inherit;
            font-size: 15px;
        }

        textarea {
            width: 100%;
            height: 140px;
            border: 1px solid #777;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
        }

        select {
            padding: 2px 4px;
            border: 1px solid #777;
            font-family: inherit;
        }

        .file-row td {
            padding-top: 8px;
        }

        .btn-submit {
            margin-top: 5px;
            padding: 2px 10px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Contact Us</h1>

        <form action="#" method="post" enctype="multipart/form-data">

            <fieldset>
                <legend>Your message:</legend>
                <table>
                    <tr>
                        <td class="label-col">To</td>
                        <td><input type="text" value="Example Cafe" readonly></td>
                    </tr>
                    <tr>
                        <td class="label-col">Your email</td>
                        <td><input type="email"></td>
                    </tr>
                    <tr>
                        <td class="label-col">Message</td>
                        <td><textarea></textarea></td>
                    </tr>
                    <tr class="file-row">
                        <td class="label-col">Attach File</td>
                        <td><input type="file"></td>
                    </tr>
                </table>
            </fieldset>

            <fieldset>
                <legend>How you found us:</legend>
                <table>
                    <tr>
                        <td style="width: 180px;">How did you hear of us</td>
                        <td>
                            <select>
                                <option value="Google" selected>Google</option>
                                <option value="Facebook">Facebook</option>
                                <option value="Friend">Friend</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td>Newsletter</td>
                        <td>
                            <label>
                                <input type="checkbox" checked>
                                Ensure this box is checked if you would like to receive email updates
                            </label>
                        </td>
                    </tr>
                </table>
            </fieldset>

            <input type="submit" value="Send message" class="btn-submit">
        </form>
    </div>

</body>
</html>
